name: Build Q2 Playdate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: itch/go.mod
          cache-dependency-path: itch/go.sum
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu libc6-dev-mipsel-cross zlib1g-dev qemu-user python3 curl zip unzip ca-certificates
      - name: Cross-compile static MIPS zlib
        run: |
          curl --fail --location --retry 3 https://zlib.net/fossils/zlib-1.3.1.tar.gz -o "$RUNNER_TEMP/zlib.tar.gz"
          tar -xzf "$RUNNER_TEMP/zlib.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/zlib-1.3.1"
          CHOST=mipsel-linux-gnu ./configure --static --prefix="$RUNNER_TEMP/mipsel-zlib"
          make -j2
          make install
      - name: Host tests
        run: |
          make check CFLAGS="-O2 -Wall"
          make check-itch
      - name: MIPS build and smoke tests
        run: |
          make check BUILD=build/mipsel CC=mipsel-linux-gnu-gcc CPPFLAGS="-I$RUNNER_TEMP/mipsel-zlib/include" LDFLAGS="-static -L$RUNNER_TEMP/mipsel-zlib/lib" RUNNER=qemu-mipsel
      - name: Build installable card ZIP
        run: |
          make card BUILD=build/mipsel CC=mipsel-linux-gnu-gcc CPPFLAGS="-I$RUNNER_TEMP/mipsel-zlib/include" LDFLAGS="-static -L$RUNNER_TEMP/mipsel-zlib/lib"
          unzip -t build/mipsel/q2-playdate-card.zip
      - name: Upload installable card
        uses: actions/upload-artifact@v4
        with:
          name: q2-playdate-card
          path: build/mipsel/q2-playdate-card.zip
          if-no-files-found: error
