name: Check itch.io downloader
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: itch/go.mod
          cache-dependency-path: itch/go.sum
      - run: make check-itch
      - run: make BUILD=build/mipsel build/mipsel/q2-playdate-itch
      - run: make check CFLAGS="-O2 -Wall"
